<body>

<!-- ============ GALERÍA ============ -->
<main id="galeria" class="container py-4">
  <div class="portfolio-background" aria-hidden="true"></div>
  <header class="portfolio-hero mb-4 mb-lg-5 mt-2 mt-lg-3">
    <div class="portfolio-heading">
      <img src="logo-blanco.png" alt="Chach App" class="portfolio-logo">
      <h1>Empresas que confían en nuestra tecnología</h1>
    </div>
   </header>
   <section class="portfolio-carousel" aria-label="Proyectos destacados">
     <button class="carousel-control carousel-control-prev" type="button" id="carouselPrev" aria-label="Proyectos anteriores">←</button>
     <div class="carousel-viewport">
       <div id="grid" class="carousel-track"></div>
     </div>
     <button class="carousel-control carousel-control-next" type="button" id="carouselNext" aria-label="Siguientes proyectos">→</button>
     <div class="carousel-progress" id="carouselProgress" aria-hidden="true"></div>
   </section>
</main>

<!-- ============ BARRA INFERIOR ============ -->
<nav class="bottombar">
  <button id="btnPublicar" class="mail-fab" aria-label="Contáctanos por correo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </svg>
  </button>
</nav>

<!-- ============ MODAL VISTA PREVIA ============ -->
<div class="modal fade" id="modalVista" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content p-0 position-relative">
       <div class="modal-body p-0" style="height:100vh;display:flex;flex-direction:column">
        <div id="vistaLoader" class="loader-overlay" style="display:none;">
          <div class="spinner"></div>
          <p>Cargando vista previa...</p>
        </div>
        <iframe id="vistaFrame" style="width:100%;height:100%;border:0;background:#fff;flex:1"></iframe>
        <button id="btnRegresarVista" class="btn-regresar-vista" title="Regresar a la galería">← Regresar</button>
       </div>
    </div>
  </div>
</div>

<!-- ============ MODAL AGREGAR RED SOCIAL ============ -->
<div class="modal fade" id="modalSocial" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-2">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Agregar red social</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <label class="small fw-semibold mb-1">Selecciona la red social</label>
        <select id="selSocial" class="neu-input mb-3">
          <option value="facebook">Facebook</option>
          <option value="instagram">Instagram</option>
          <option value="tiktok">TikTok</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="twitter">X / Twitter</option>
          <option value="youtube">YouTube</option>
          <option value="linkedin">LinkedIn</option>
          <option value="telegram">Telegram</option>
        </select>
        <label class="small fw-semibold mb-1">Enlace (URL)</label>
        <input type="url" id="inputSocialUrl" class="neu-input mb-3" placeholder="https://facebook.com/tu-negocio">
        <div id="socialErr" class="small text-danger" style="display:none"></div>
      </div>
       <div class="modal-footer border-0">
         <button type="button" class="neu-btn" data-bs-dismiss="modal">Cancelar</button>
         <button type="button" id="btnGuardarSocial" class="neu-btn primary">Agregar</button>
       </div>
    </div>
  </div>
</div>

<!-- ============ MODAL PUBLICAR ============ -->
<div class="modal fade" id="modalPublicar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-2">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Contáctanos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="formPublicar">
        <div class="modal-body">
          <div id="pubOk" class="neu-in p-3 text-center" style="display:none">
            <div class="fs-1">✅</div>
            <p class="fw-semibold mb-1">¡Solicitud enviada!</p>
            <p class="small opacity-75 mb-0" id="pubOkTxt">Recibimos tu información y tu HTML final. Te contactaremos pronto.</p>
          </div>
          <div id="pubCampos">
            <input type="hidden" name="plantilla" id="fPlantilla">
            <label class="small fw-semibold mb-1" for="fNombre">Tu nombre</label>
            <input class="neu-input mb-3" id="fNombre" name="nombre" required data-fs-field>
            <label class="small fw-semibold mb-1" for="fEmail">Correo electrónico</label>
            <input class="neu-input mb-3" type="email" id="fEmail" name="email" required data-fs-field>
            <label class="small fw-semibold mb-1" for="fWhats">WhatsApp</label>
            <input class="neu-input mb-3" type="tel" id="fWhats" name="whatsapp" required data-fs-field>
            <label class="small fw-semibold mb-1" for="fMsg">Mensaje</label>
            <textarea class="neu-input mb-2" rows="3" id="fMsg" name="mensaje" placeholder="Comentarios o indicaciones extra (opcional)" data-fs-field></textarea>
            <div id="pubErr" class="small text-danger" style="display:none"></div>
          </div>
        </div>
         <div class="modal-footer border-0">
           <button type="button" class="neu-btn" data-bs-dismiss="modal">Cerrar</button>
           <button type="submit" id="btnEnviar" class="neu-btn primary" data-fs-submit-btn>Enviar</button>
         </div>
      </form>
    </div>
  </div>
</div>

<!-- Aviso -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000">
  <div id="toast" class="toast neu border-0" role="status"><div class="toast-body fw-semibold" id="toastMsg"></div></div>
</div>
